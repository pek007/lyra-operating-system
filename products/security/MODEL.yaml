id: A-004
slug: security
name: Security
type: internal
owner: Lyra
status: active
lifecycle: incubation

domain: OS
purpose: >
  Protect Lyra OS and current customer environments through practical controls,
  explicit boundaries, and evidence-backed security operations.

users:
  primary:
    - peter
    - product-owners
  secondary:
    - pxs-environment

strategic_role:
  portfolio_role: enabling
  linked_company_goals:
    - clear-direction-and-governance
    - reliable-software-delivery-capability

operating_model:
  cadence: recurring posture and product reviews
  planning_horizon: rolling 2-6 weeks
  release_mode: evidence-backed control and posture changes
  governance_level: high

dependencies:
  upstream:
    - governance
    - security-evidence-sources
  downstream:
    - all-active-products
    - pxs-environment
  critical_constraints:
    - no silent trust-boundary expansion
    - explicit review for material risk acceptance

artifacts:
  product: PRODUCT.md
  vision: 01-identity/VISION.md
  customer: 01-identity/CUSTOMER.md
  strategy: 02-strategy/STRATEGY.md
  distribution_model: 02-strategy/DISTRIBUTION_MODEL.md
  operating_model: 03-operating-model/OPERATING_MODEL.md
  governance: 03-operating-model/GOVERNANCE.md
  roadmap: 04-execution/ROADMAP.md
  plan: 04-execution/PLAN.md
  risks: 04-execution/RISKS.md
  metrics: 05-performance/METRICS.md
  pxs_deployment_baseline: 05-performance/PXS_DEPLOYMENT_BASELINE.md
  interfaces: 06-architecture/INTERFACES.md
  boundary: 06-architecture/BOUNDARY.md
  decisions: 07-decisions/DECISIONS.md
  research_model: 08-research/RESEARCH_MODEL.yaml
  research_domain_map: 08-research/DOMAIN_MAP.md
  research_radar: 08-research/RADAR.md
  research_deep_dive_index: 08-research/DEEP_DIVE_INDEX.md
  research_doctrine: 08-research/DOCTRINE.md
  research_implications: 08-research/IMPLICATIONS.md
  research_sources: 08-research/SOURCES.md

metrics:
  north_star:
    - important security risks are visible and deliberately managed
  health:
    - posture clarity
    - control coverage
    - evidence freshness
  guardrails:
    - no unreviewed trust-boundary changes
    - no material silent exposure drift

review:
  review_cadence: weekly
  last_reviewed: 2026-03-17
