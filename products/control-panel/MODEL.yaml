id: CP-001
slug: control-panel
name: Control Panel
type: internal
owner: Peter / Lyra
status: active
lifecycle: incubation

domain: OS
purpose: >
  Provide a trusted control and model-stewardship surface for observing,
  governing, and operating Lyra OS.

users:
  primary:
    - product-owners
    - operators
  secondary:
    - pxs-facing-product-teams

strategic_role:
  portfolio_role: enabling
  linked_company_goals:
    - build-ai-operating-system
    - clear-direction-and-governance

operating_model:
  cadence: periodic product review with iterative refinement
  planning_horizon: rolling 2-6 weeks
  release_mode: iterative, evidence-backed changes
  governance_level: medium

dependencies:
  upstream:
    - governance
    - shared-platform-capabilities
    - lyra-os-model
  downstream:
    - lyra-os-operators
  critical_constraints:
    - separate runtime boundary should be preserved
    - avoid direct dependency on PX product codebases
    - do not collapse all model-domain ownership into control-panel

artifacts:
  product: PRODUCT.md
  vision: 01-identity/VISION.md
  strategy: 02-strategy/STRATEGY.md
  operating_model: 03-operating-model/OPERATING_MODEL.md
  plan: 04-execution/PLAN.md
  metrics: 05-performance/METRICS.md
  interfaces: 06-architecture/INTERFACES.md
  decisions: 07-decisions/DECISIONS.md

metrics:
  north_star:
    - operators can understand system state and act safely from one trusted surface
  health:
    - observability quality
    - operational decision speed
    - trust in control outputs
    - model coherence visibility
  guardrails:
    - boundary discipline
    - change safety

review:
  review_cadence: monthly
  last_reviewed: 2026-03-26
