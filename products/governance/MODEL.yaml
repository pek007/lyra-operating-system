id: A-008
slug: governance
name: Governance
type: internal
owner: Lyra
status: active
lifecycle: incubation

domain: OS
purpose: >
  Provide the system-level rules, decision-rights logic, boundary discipline,
  and change-control mechanisms that keep Lyra OS coherent as it evolves.

users:
  primary:
    - peter
    - product-owners
  secondary:
    - pxs-environment

strategic_role:
  portfolio_role: enabling
  linked_company_goals:
    - clear-direction-and-governance
    - build-ai-operating-system

operating_model:
  cadence: recurring governance review and rule maintenance
  planning_horizon: rolling 2-6 weeks
  release_mode: cautious, explicit rule and control updates
  governance_level: high

dependencies:
  upstream:
    - governance-records
    - portfolio-artifacts
  downstream:
    - all-active-products
  critical_constraints:
    - governance must enable flow rather than create process theater
    - shared rules must not duplicate product-owned operating logic

artifacts:
  product: PRODUCT.md
  vision: 01-identity/VISION.md
  strategy: 02-strategy/STRATEGY.md
  operating_model: 03-operating-model/OPERATING_MODEL.md
  plan: 04-execution/PLAN.md
  metrics: 05-performance/METRICS.md
  interfaces: 06-architecture/INTERFACES.md
  decisions: 07-decisions/DECISIONS.md

metrics:
  north_star:
    - system-level rules are explicit, usable, and actually followed
  health:
    - rule clarity
    - decision-rights clarity
    - governance drift
  guardrails:
    - no silent boundary expansion
    - no conflicting sources of operating authority

review:
  review_cadence: monthly
  last_reviewed: 2026-03-11
