id: A-007
slug: task-management
name: Task Management
type: internal
owner: Lyra
status: active
lifecycle: incubation

domain: OS
purpose: >
  Provide task and decision management capability for Lyra OS and downstream
  consuming workspaces, with TDE as the primary capability focus.

users:
  primary:
    - pxs-workspace
    - lyra-os
  secondary:
    - internal-agents

strategic_role:
  portfolio_role: enabling
  linked_company_goals:
    - build-ai-operating-system
    - reliable-software-delivery-capability
    - task-and-decision-management-capability

value_logic:
  creates_value_by:
    - increasing task visibility and execution reliability
    - improving decision traceability and follow-through
    - enabling downstream workspaces to consume structured task/decision capability
  captures_value_by:
    - reducing coordination friction and operating overhead
    - increasing throughput and quality of execution
    - creating a reusable capability that may later be productized
  success_conditions:
    - TDE is reliable enough for routine operational use
    - consuming workspaces can adopt the product through clear interfaces
    - evidence and governance remain proportionate but explicit

operating_model:
  cadence: weekly product review with continuous improvement between reviews
  planning_horizon: rolling 2-6 weeks for execution; quarterly for strategic evolution
  release_mode: iterative, evidence-backed changes
  governance_level: medium

dependencies:
  upstream:
    - governance
    - lyra-runtime
    - task-decision-engine-contract
  downstream:
    - pxs-environment
  critical_constraints:
    - no hidden cross-workspace coupling
    - material real-world-impact changes remain visible to Peter
    - deployment decisions require evidence and readiness checks

artifacts:
  product: PRODUCT.md
  vision: 01-identity/VISION.md
  customer: 01-identity/CUSTOMER.md
  strategy: 02-strategy/STRATEGY.md
  operating_model: 03-operating-model/OPERATING_MODEL.md
  governance: 03-operating-model/GOVERNANCE.md
  distribution_model: 02-strategy/DISTRIBUTION_MODEL.md
  roadmap: 04-execution/ROADMAP.md
  plan: 04-execution/PLAN.md
  risks: 04-execution/RISKS.md
  metrics: 05-performance/METRICS.md
  readiness_scorecard: 05-performance/READINESS_SCORECARD.md
  interfaces: 06-architecture/INTERFACES.md
  pxs_consumption_interface: 06-architecture/PXS_CONSUMPTION_INTERFACE.md
  decisions: 07-decisions/DECISIONS.md
  delivery_mode_decision_pxs: 07-decisions/DELIVERY_MODE_DECISION_PXS_V1.md

metrics:
  north_star:
    - downstream task/decision management is reliably usable in pxs
  health:
    - execution reliability
    - decision traceability
    - intake-to-completion cycle time
    - downstream adoption
  guardrails:
    - governance compliance
    - interface clarity
    - operational safety

review:
  review_cadence: weekly
  last_reviewed: 2026-03-11
