name: devsecops-baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate process metadata
        run: python3 tools/validate_process_metadata.py

      - name: Validate review dates
        run: python3 tools/validate_review_dates.py

      - name: TDE thin-slice tests
        run: python3 tools/tde_kernel_slice_tests.py

      - name: TDE hardening regressions
        run: |
          python3 tools/test_s15_binding_integrity.py
          python3 tools/test_s16_objective_linkage.py
          python3 tools/test_s17_binding_resolution_failclosed.py
          python3 tools/test_s18_atomic_writeback.py
          python3 tools/test_s25_binding_lifecycle.py
          python3 tools/test_s32_shadow_state_write.py
          python3 tools/test_s33_shadow_thresholds.py

      - name: Fail-closed binding guard check
        run: python3 tools/check_binding_failclosed_guard.py
